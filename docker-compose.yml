services:
  db:
    image: postgres:16-alpine
    container_name: shop-ee-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop_ee}
      POSTGRES_USER: ${POSTGRES_USER:-shop_ee_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop_ee_pass}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs every .sql in database/ on first startup (alphabetical order)
      - ./database/payment:/docker-entrypoint-initdb.d/01-payment
      - ./database/products:/docker-entrypoint-initdb.d/02-products
      - ./database/profile:/docker-entrypoint-initdb.d/03-profile
      - ./database/orders:/docker-entrypoint-initdb.d/04-orders
      - ./database/shipment:/docker-entrypoint-initdb.d/05-shipment
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-shop_ee_user} -d ${POSTGRES_DB:-shop_ee}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: shop-ee-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      MY_VAR: ${MY_VAR:-}
      OPEN_AI_API_KEY: ${OPEN_AI_API_KEY:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-shop_ee}
      POSTGRES_USER: ${POSTGRES_USER:-shop_ee_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shop_ee_pass}

volumes:
  postgres_data:
